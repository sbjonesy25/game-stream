[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamwall"
version = "0.1.0"
description = "A local four-pane HLS viewer for Ubuntu"
requires-python = ">=3.10"
dependencies = ["PySide6==6.8.3", "python-vlc==3.0.21203", "playwright==1.51.0", "requests==2.32.5"]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[project.scripts]
streamwall = "streamwall.app:main"

[tool.setuptools.packages.find]
include = ["streamwall*"]
